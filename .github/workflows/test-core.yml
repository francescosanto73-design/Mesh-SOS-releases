name: Test nucleo KDBX
on:
  push:
    paths: ["custode-core/**", ".github/workflows/test-core.yml"]
  workflow_dispatch:
jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Installa KeePassXC e pykeepass (implementazioni di riferimento)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq keepassxc
          pip install pykeepass
      - run: gradle --no-daemon installDist
        working-directory: custode-core
      - run: python3 tests/interop_test.py
        working-directory: custode-core
      - run: python3 tests/keepassxc_test.py
        working-directory: custode-core
      - run: python3 tests/extras_test.py
        working-directory: custode-core
      - run: gradle --no-daemon test
        working-directory: custode-core
