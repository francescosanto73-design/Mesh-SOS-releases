name: Build Custode (KeePassDX fork)
on:
  push:
    paths: ["custode-kdx/**", ".github/workflows/build-custode-kdx.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custode-kdx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: SDK, NDK e CMake (SDK preinstallato sul runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleLibreDebug
      - name: Hash dell'APK
        run: sha256sum app/build/outputs/apk/libre/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Custode-libre-debug
          path: custode-kdx/app/build/outputs/apk/libre/debug/*.apk
